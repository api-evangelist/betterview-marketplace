name: BetterView Marketplace
description: >-
  Betterview is a market-leading Property Intelligence platform that delivers
  actionable insights to property & casualty insurance underwriters, agents, and
  insureds to increase efficiency and profitability. Its API lets carriers order
  and retrieve property profiles enriched with the Roof Spotlight Index (RSI),
  peril risks, flags, and third-party Partner Connect data, subscribe properties
  to PropertyPulse monitoring, and query PropertyNow pre-processed datasets by
  address or coordinates. Betterview integrates with core insurance systems
  including Guidewire (a Marketplace accelerator for PolicyCenter 10), Duck
  Creek, and Socotra, and supports SSO, Secure FTP, ImageRight drop, an
  embeddable geospatial iframe UI, and an External Data Warehouse (EDW) SQL
  connection.
